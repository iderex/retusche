# Dependency version updates arrive as pull requests that run the whole gate,
# rather than as edits applied to the default branch by hand.
#
# Two ecosystems, because this tree pins in two places.
#
# The workflows pin every action to a commit sha with the version in a trailing
# comment, which is the form this updater rewrites in place, comment included.
# Without it those pins sit at whatever was current on the day each workflow was
# written, and the pinning that makes a supply chain reproducible is the same
# property that makes it stale.
#
# `uv.lock` holds the resolved development set. `uv sync --locked` refuses a tree
# whose lock and project file disagree, so a version change cannot arrive as a
# resolve on somebody's machine; it has to arrive as a committed lock somebody
# reviewed.
#
# Nothing here is exempt from anything. A pull request from this updater meets
# the same checks as any other, and `.github/workflows/dco.yml` already exempts
# the bot author by name from the sign-off gate, as the DCO App does, because a
# bot commit cannot self-certify the DCO.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Deliberately small. A batch nobody can read is a batch that gets merged
    # unread.
    open-pull-requests-limit: 3
    groups:
      # One pull request for the routine sha refreshes, so a week of them is one
      # review rather than one per workflow. A major bump stays on its own,
      # because that is the one where the action's inputs can have changed under
      # the pin.
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
