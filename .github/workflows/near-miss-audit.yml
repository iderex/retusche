# A near miss for the workflow audit, removed once the red run is recorded.
#
# Two omissions, both of them the thing somebody writes when copying a job from
# a tutorial: no permissions block at all, so the job inherits whatever the
# repository default is, and a checkout that leaves the token in .git/config
# for every later step to reach.
#
# Dispatch only, so nothing here runs on a push or a pull request.
name: near-miss-audit

on:
  workflow_dispatch:

jobs:
  near-miss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
