# Gates that run against the project's own code, as opposed to the guards that
# judge supply chain and workflow hygiene. It holds the lock gate, the type
# gate, the format-and-lint gate and the test gate; which of these names has to
# stand in front of the default branch is #6.
#
# No `name:` on the jobs below: the ruleset that guards the default branch
# matches a required status check by its literal check-run name, which defaults
# to the job id when no `name:` is set. Overriding it here would rename the
# check run and silently remove whatever gate was matching the old name. This is
# the same reason dependency-review.yml gives for leaving its job unnamed.
name: Pull request checks

on:
  # Every base branch, not only main, so a future release branch is gated too.
  pull_request:
    branches: ["**"]

# Deny by default at workflow level; the job grants only what it needs.
permissions: {}

# A newer push to the same pull request supersedes an in-flight run. These gates
# read the tree and publish nothing, so cancelling a superseded run is safe.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # checkout only
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here needs history and no step pushes.
          fetch-depth: 1
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: The lock file matches the project file
        # Not the same check as `uv sync --locked` in the jobs below. That one
        # refuses to install against a lock that disagrees with the project
        # file, which is this drift caught at the moment it would produce a
        # wrong environment. This one asks whether a resolve would rewrite the
        # lock at all, and answers before anything is installed.
        #
        # It reports and never repairs: on a drift it prints
        # `hint: To update the lockfile, run uv lock` and exits non-zero, so the
        # branch is left exactly as the author pushed it and the repair is a
        # thing they do rather than a thing a runner did to their tree.
        run: uv lock --check

  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout only
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the suppression scan below can walk the tracked tree
          # with git grep; no step pushes, so do not persist the token.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Create the environment from the lock file
        # --locked refuses to resolve: if pyproject.toml and uv.lock disagree the
        # job stops here rather than type-checking against a set of versions no
        # other machine would get.
        run: uv sync --locked

      - name: Type check
        run: uv run mypy

      - name: Refuse a suppression that carries no reason
        # A `# type: ignore[code]` with nothing after it says what is switched off
        # and never why, so the next reader cannot tell a considered suppression
        # from one somebody added to get a red build green. mypy's
        # ignore-without-code refuses the bare form; nothing in mypy refuses the
        # coded form with no trailing comment, which is what this step is for.
        #
        # git grep: 0 = an offender was found, 1 = clean, >=2 = scanner error.
        # Fail closed on the error case rather than reading a broken scan as a
        # clean tree.
        run: |
          set -euo pipefail
          rc=0
          git grep -nE '# type: ignore(\[[^]]*\])?[[:space:]]*$' -- '*.py' || rc=$?
          case "$rc" in
            0)
              echo "::error::A type suppression above carries no reason. Write it on the same line: '# type: ignore[code]  # why this is correct here'."
              exit 1
              ;;
            1)
              echo "Every type suppression carries a reason on its own line."
              ;;
            *)
              echo "::error::suppression scan error (git grep exit $rc) - failing closed instead of assuming the tree is clean."
              exit 1
              ;;
          esac

      - name: Count the type suppressions
        # The census is printed rather than capped. A cap invites the argument
        # about where to set it; a number in the log means growth is visible in
        # the diff of two runs, and the pull request that adds the fourth
        # suppression cannot present itself as adding none.
        run: |
          set -euo pipefail
          rc=0
          count=$(git grep -hoE '# type: ignore' -- '*.py' | wc -l) || rc=$?
          if [ "$rc" -gt 1 ]; then
            echo "::error::suppression census error (exit $rc) - failing closed."
            exit 1
          fi
          echo "Type suppressions in tracked Python files: ${count}"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout only
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes, so do not persist the token.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Create the environment from the lock file
        # Same reason as the type gate: --locked stops here if pyproject.toml and
        # uv.lock disagree, rather than judging the tree with a formatter version
        # no other machine would resolve to.
        run: uv sync --locked

      - name: Check the formatting
        # --check writes nothing and exits non-zero on a file that would change,
        # naming it. `uv run ruff format` without the flag is the repair, and it
        # is the same binary from the same lock file, so the gate and the repair
        # cannot disagree about what formatted means.
        run: uv run ruff format --check

      - name: Lint
        # No rules on this command line. The set is in pyproject.toml, so a local
        # run judges the same file the same way; a flag here would be a rule that
        # exists only inside this workflow.
        #
        # --no-fix because a gate reports, it does not edit. --output-format=github
        # puts each finding on its line in the diff, and every finding is a
        # failure: ruff has no severity below error, so there is no warning here
        # that could be passed over.
        run: uv run ruff check --no-fix --output-format=github

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout only
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes, so do not persist the token.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Create the environment from the lock file
        # Same reason as the gates above. Here it also fixes the coverage
        # version, and the floor is a number a particular coverage produced.
        run: uv sync --locked

      - name: Say what the runner had
        # The suite is meant to pass with no GPU driver present. That is a claim
        # about a machine, so the run prints the machine rather than this file
        # asserting it. Nothing here refuses anything: turning these facts into a
        # property the suite refuses a violation of is #84.
        #
        # Every branch prints something. A step that printed nothing on the
        # absent case would read the same as a step that was skipped.
        run: |
          set -euo pipefail
          if command -v nvidia-smi >/dev/null 2>&1; then
            echo "nvidia-smi: on PATH"
          else
            echo "nvidia-smi: not on PATH"
          fi
          if compgen -G '/dev/nvidia*' >/dev/null; then
            echo "device nodes: /dev/nvidia* present"
          else
            echo "device nodes: no /dev/nvidia*"
          fi
          echo "DISPLAY=${DISPLAY-unset}"
          echo "WAYLAND_DISPLAY=${WAYLAND_DISPLAY-unset}"
          echo "effective uid: $(id -u)"

      - name: Run the suite under the coverage floor
        # No options on this command line. The test paths, the coverage scope and
        # the floor are all in pyproject.toml, so `uv run pytest` on a laptop
        # judges the tree exactly as this job does. A --cov flag here would be a
        # measurement that exists only inside this workflow.
        run: uv run pytest
