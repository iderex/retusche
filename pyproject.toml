[project]
name = "retusche"
version = "0.0.0"
description = "Self-hosted backend for generative photo editing"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
# Pinned to one minor series rather than a floor. A floor lets two machines
# resolve the same lock file against different interpreters and get different
# wheels; the point of the lock is that they do not. Widening this is a
# deliberate change to the lock, not a side effect of someone's local install.
requires-python = "==3.14.*"

# No runtime dependencies yet. The two layers declare their own sets below so
# the boundary in #7 has something to hold, and so a dependency added for the
# engine never becomes reachable from the process that listens on a socket.
dependencies = []

[project.optional-dependencies]
# The orchestration layer: HTTP surface, job model, model management, library
# client. The HTTP framework arrives with the API milestone.
orchestrator = []
# The engine worker, and the only place a machine-learning runtime may be
# declared. It arrives with the first engine.
worker = []

[dependency-groups]
# Tooling the gates run. Pinned exactly: a checker that moves under a range
# decides different things about unchanged code on different days, and a
# formatter that moves under one rewrites files nobody touched.
#
# coverage is pinned here as well as arriving under pytest-cov. The floor below
# is a number one of these versions produced, and a coverage that moved under
# pytest-cov's range would move the number without anything in this file
# changing.
dev = [
    "coverage==7.15.3",
    "mypy==2.3.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.1",
]

[project.urls]
Homepage = "https://github.com/iderex/retusche"
Issues = "https://github.com/iderex/retusche/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/retusche",
    "src/retusche_contracts",
    "src/retusche_worker",
]

# Kept out of the artefact an operator installs. `retusche.testing` holds an
# implementation of the engine contract that reaches no device and produces
# derived noise, which is what the suite needs and what nothing outside it has a
# use for. A test double reachable from an installed service is a thing somebody
# eventually selects by accident, and the accident is silent: the jobs succeed.
#
# The path is anchored with a leading slash so it names this directory and not
# any `testing` further down. `tests/test_packaging.py` says what the check over
# this line does and does not establish.
exclude = ["/src/retusche/testing"]

[tool.retusche]
# This project's own data, read by the suite rather than restated inside it.

[tool.retusche.import-boundary]
# Top-level module names that stand for a machine-learning runtime or a model
# library. Module roots and not distribution names, because what an import
# statement carries is a module name and the distribution behind it is not
# visible where the rule has to decide.
#
# Two rules read this list. Test discovery refuses a unit test that imports any
# of them while the module executes, and the import-graph test refuses an
# orchestration module that reaches one at any depth.
#
# Not on the list, deliberately: Pillow and numpy. Neither is a machine-learning
# runtime, decoding what arrives from a stranger is the orchestration layer's own
# work, and a list that grows to mean "heavy" stops meaning anything.
forbidden-roots = [
    "accelerate",
    "bitsandbytes",
    "diffusers",
    "flax",
    "jax",
    "jaxlib",
    "keras",
    "onnx",
    "onnxruntime",
    "peft",
    "safetensors",
    "sentencepiece",
    "tensorflow",
    "timm",
    "tokenizers",
    "torch",
    "torchaudio",
    "torchvision",
    "transformers",
    "triton",
    "xformers",
]

# The packages that must stay importable in the process that accepts HTTP, and
# so the only ones of this project's own packages an orchestration module may
# reach. Everything else under src/ is out of bounds for that process, derived
# from the tree rather than listed here, so a package arriving later is outside
# the boundary until somebody decides otherwise.
#
# retusche is the orchestration layer. retusche_contracts is the engine
# interface, which is declarations and standard-library types and is what the
# orchestration layer is meant to talk to the worker through.
socket-safe-roots = ["retusche", "retusche_contracts"]

# Where the import-graph walk starts. Everything socket-safe is judged whether
# or not the walk reaches it, and this only decides which module a reported
# chain begins at.
entry-point = "retusche"

[tool.retusche.layer-imports]
# Each package under src/ and the packages of this project it may reach, itself
# included. Read by tests/conformance/, which walks the import graph from each row
# and refuses a chain that leaves that row's set, at any depth and function bodies
# included.
#
# The orchestration layer has no row here. Its set is socket-safe-roots above,
# which the boundary rule reads, and a copy of it here would be two lists for one
# property with nothing refusing a divergence between them. The conformance suite
# refuses a package under src/ that is in neither place, so a package arriving
# tomorrow is judged by one of the two rather than by neither.
#
# Runtime roots are not repeated either. forbidden-roots above is refused to the
# socket-safe packages by the boundary rule and is permitted to the worker by the
# layout, so what these rows decide is this project's own edges and nothing else.
#
# The worker may reach the contract and not the orchestrator: a worker that
# reaches back into the orchestrator turns two operating-system processes into one
# program split across a pipe, and the process boundary exists so the queue
# survives a native crash. The contract may reach neither of its users: a contract
# that imports one of them makes the other's dependency on the contract a
# dependency on that user.
retusche_worker = ["retusche_worker", "retusche_contracts"]
retusche_contracts = ["retusche_contracts"]

[tool.retusche.coverage-exclusions]
# A package under src/ that coverage does not measure, and why. The suite prints
# every entry at the end of a run: a report that simply left the package out
# would read exactly like a report where it was measured and found complete.
#
# The suite refuses to start if a package under src/ is in neither this table nor
# [tool.coverage.run] source, so a new package cannot arrive without a decision.
retusche_worker = "the engine worker, the one package permitted a machine-learning runtime. No unit test loads it, so a coverage number over it would describe code this suite deliberately never runs. Its own harness is the hardware one."

[tool.retusche.output-discipline]
# One module builds a log line and refuses one carrying a photograph, a prompt or
# a path out of the operator's library. That refusal is worth what the number of
# ways around it allows, so this is the list of ways around it that a reading of
# the syntax can close.
#
# The package that holds the declaration is outside the rule, because it is the
# thing everything else is required to go through.
through = "retusche.logging.records"
declared-in = "retusche.logging"

# Judged packages. The worker is deliberately absent: the layer rules refuse it
# an import of the orchestration layer, so it cannot reach the declaration, and a
# rule refusing it a logger as well would leave it with no way to say anything at
# all. What the worker says, and to whom, arrives with the supervisor in #17.
judged-roots = ["retusche", "retusche_contracts"]

# A logging framework, by module root. Only the standard library's is here,
# because it is the only one reachable: no third-party logger is in the
# dependency set, and one arriving is a lock change that passes a review. Adding
# it here at that point is a data change and nothing else.
refused-imports = ["logging"]

# Writing to the process's own output without going through the declaration.
#
# `print` is not in this list and its absence is deliberate. ruff's T20 already
# refuses it, and a second mechanism deciding one question means two places to
# change and two verdicts to reconcile. What T20 matches is the name `print` and
# the name `pprint`, so the line somebody writes after being refused once goes
# straight past it, and that line is what these two entries are for.
refused-calls = ["sys.stdout.write", "sys.stderr.write"]

[tool.retusche.output-discipline.prevents]
# What each invariant prevents, in the declaration rather than in the rule, so
# the refusal a reader meets carries the reason and adding an invariant is an
# entry here.
imports-a-logger = "a second way to write a line, with no declared field set behind it, so a filename or a prompt reaches a log through a format string nobody reviewed"
writes-directly = "a line that never passes the field check at all, written straight to the process's output where nothing reads it but the operator's log collector"

[tool.retusche.hardware-harness]
# The one word a test says when it needs a device. Written here rather than in
# the three places that act on it, because those three have to agree: pytest
# registers it under [tool.pytest.ini_options] markers, the same table's addopts
# deselects it, and the discovery rule in tests/conftest.py refuses an unmarked
# test that reaches for a runtime. tests/test_hardware_harness.py holds them to
# this string, so a rename that reaches two of the three is a red run rather
# than a gate that quietly stops selecting anything.
marker = "hardware"

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]

# The markers this suite knows. --strict-markers below refuses any other, so an
# invented one fails collection instead of silently matching nothing.
markers = [
    "hardware: needs a real device, a driver and weights. Not collected by the default run.",
]

# --cov with no value measures what [tool.coverage.run] source names, so the
# scope is stated once and the command line carries no rule of its own. The
# floor is in [tool.coverage.report] for the same reason.
#
# -m "not hardware" is here and not on a command line for the same reason as the
# rest: a selection a contributor has to remember is one that is forgotten on the
# machine with a GPU in it, where the forgetting is invisible because the tests
# pass.
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-m",
    "not hardware",
    "--cov",
    "--cov-report=term-missing",
]

# A warning is a finding. This suite has no legacy to grandfather, so the day
# a dependency starts deprecating something is the day it is dealt with rather
# than the day it scrolls past.
filterwarnings = ["error"]

# An xfail that passes is a test whose reason no longer holds. Strict makes that
# a failure instead of a green line nobody reads.
xfail_strict = true

[tool.coverage.run]
# Named as paths rather than as packages so the entry is wrong in a way that can
# be seen. The suite checks these against what is actually under src/.
source = ["src/retusche", "src/retusche_contracts"]

# Branch coverage, not only line coverage. A guard whose false arm is never
# taken is a guard nothing has proven, and line coverage calls it covered.
branch = true

[tool.coverage.report]
# The floor. It is what the tree measures today rather than a round number
# chosen to leave room: a floor below the measurement is a floor a change can
# walk under while staying green, which is the thing this is for. CONTRIBUTING.md
# carries the command that produces it.
fail_under = 100
show_missing = true
skip_covered = false

exclude_also = [
    # A Protocol method body. The `def` line runs when the class is built; the
    # ellipsis under it never runs anywhere, so counting it as missed would mean
    # lowering the floor to accommodate a line that cannot be reached.
    "^\\s*\\.\\.\\.$",
]

[tool.ruff]
# The rule set lives here and never on a command line. A flag passed in a
# workflow is a rule that only exists where that workflow runs, so a local run
# and a gate run judge the same file differently and the difference is
# invisible until one of them is red.
#
# No `target-version`. Ruff reads `requires-python` above, so the syntax it
# assumes cannot drift away from the interpreter this project is pinned to.
line-length = 88

[tool.ruff.lint]
# Selected for what each family refuses, not for coverage. mypy already holds
# the type surface, so nothing here is chosen to duplicate it.
select = [
    "F",     # pyflakes: undefined name, unused import, the errors that are errors
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings, which this gate treats as failures like the rest
    "I",     # import sorting, so an import block is never a review topic
    "N",     # pep8-naming
    "UP",    # pyupgrade: syntax kept at the pinned interpreter rather than below it
    "B",     # bugbear: the mutable-default and loop-variable-capture family
    "C4",    # comprehension rewrites
    "SIM",   # simplifications a reader would have asked for anyway
    "RET",   # return-path shapes
    "PIE",   # small dead constructs
    "PTH",   # pathlib over os.path, one way to say a path
    "S",     # bandit: this is a network-facing service that reads other people's files
    "ASYNC", # blocking calls inside async, which an HTTP surface will have
    "DTZ",   # naive datetimes, in a project that will state retention periods
    "LOG",   # logging call shapes
    "G",     # logging format strings, so a message is not built before it is needed
    "T20",   # print, which is not how a service says anything
    "TID",   # tidy imports: relative-import discipline across the package boundary
    "RUF",   # ruff's own rules
]

# What is deliberately not selected, so the absence reads as a decision.
#
# ANN and D are not here. mypy runs strict, which already refuses a function
# without annotations, and a second mechanism for one property means two places
# to change and two verdicts to reconcile. Docstring style is a judgement this
# project has not made yet; making it here would enforce a convention nobody
# wrote down.
#
# COM and ISC are not here because the formatter owns that ground. A linter and
# a formatter arguing over commas and implicit concatenation produce a file that
# each of them wants to change back.

[tool.ruff.lint.per-file-ignores]
# A test asserts. S101 refuses `assert` because it vanishes under `python -O`,
# which is true of shipped code and beside the point in a suite.
"tests/**" = ["S101"]

# N818 wants every exception class to end in `Error`. The engine contract names
# its base `EngineError` and its subclasses for the condition instead, so a
# caller writes `except Cancelled:` and reads a sentence. Whether that is the
# right convention belongs to #14, which declared the interface, and a gate
# landing afterwards is not where an interface gets renamed. Narrowed to the one
# module that holds those classes, so a badly named exception anywhere else is
# still refused.
"src/retusche_contracts/engine.py" = ["N818"]

[tool.ruff.lint.isort]
known-first-party = ["retusche", "retusche_contracts", "retusche_worker"]

[tool.mypy]
# Strict from the first module. Turning it on later costs one repair per module
# written under the looser setting, and the count only grows.
strict = true
python_version = "3.14"
files = ["src"]

# The escape hatches, all held shut. ignore_missing_imports is the one that
# matters: switched on globally it silences every untyped third-party package at
# once, including the next one somebody adds, and nothing says which. The block
# at the bottom of this file is where a named library is declared instead.
ignore_missing_imports = false
follow_imports = "normal"
warn_unused_configs = true
warn_unused_ignores = true
disallow_any_unimported = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_reexport = true

# ignore-without-code refuses a bare `# type: ignore`, so a suppression must
# name the error it suppresses and cannot quietly cover a second fault that
# appears on that line later.
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "possibly-undefined",
]

# Third-party libraries that ship no type information are declared here, in one
# place, and never with a per-import-site silence. There are none yet: this
# project declares no runtime dependencies. Each entry added below carries the
# library, the reason it has no stubs, and what would retire the entry.
#
# [[tool.mypy.overrides]]
# module = ["example_untyped_library.*"]
# ignore_missing_imports = true
